<script>

,alive:true}];const crystals=[{x:765,taken:false},{x:1070,taken:false},{x:1360,taken:false}];const platforms=[{x:340,y:337,w:105},{x:840,y:346,w:125},{x:1095,y:330,w:110},{x:1630,y:346,w:120},{x:1845,y:330,w:110}];const boss={x:2190,y:0,hp:5,shield:true,alive:true};function resize(){const r=canvas.getBoundingClientRect();W=360;H=Math.max(440,Math.min(690,Math.round(r.height/r.width*360)));canvas.width=Math.round(r.width*Math.min(2,devicePixelRatio||1));canvas.height=Math.round(r.height*Math.min(2,devicePixelRatio||1));ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);ground=H-100;if(!last)player.y=ground-player.h;boss.y=ground-100}window.addEventListener('resize',resize);resize();function show(title,body,button,action,icon='🤖'){mode='pause';overlay.classList.remove('hidden');panel.innerHTML=`<div class="mascot">${icon}</div><h2>${title}</h2>${body}<button class="primary" id="continue">${button}</button>`;document.getElementById('continue').onclick=()=>{overlay.classList.add('hidden');mode='play';last=performance.now();action?.()}}function intro(){show('¡Bienvenido, BYTE!',`<p><strong>¿Cómo decide una computadora?</strong> No necesitas saber programar. <strong>SI</strong> tienes una llave, <strong>ENTONCES</strong> puedes abrir la puerta.</p><p>Muévete, salta y dispara a los glitches. Recoge la llave y descubre cómo funciona una <strong>condición</strong>.</p><p class="sub">3 mundos · 3 desafíos por mundo · evaluaciones finales</p>`,'🎮 ¡EMPEZAR!',()=>{startedAt=performance.now()},'🤖')}function message(t){toast.textContent=t;toast.classList.add('on');toastTime=2.4}function sparkle(x,y,c='#ffee75',n=10){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*230,vy:(Math.random()-.9)*200,life:.7,color:c})}function hurt(){if(player.immune>0||mode!=='play')return;player.hearts--;player.immune=2.3;player.vy=-260;player.vx=-160*player.face;sparkle(player.x,player.y,'#ff78a3',10);message('¡Cuidado! Tienes protección temporal.');if(player.hearts<=0){player.hearts=4;player.x=checkpoint;player.y=ground-player.h;player.vx=0;player.vy=0;player.immune=3;message('♥ Vidas restauradas. ¡Sigue aprendiendo!')}}function shoot(){if(player.shotCD>0)return;bullets.push({x:player.x+(player.face>0?player.w:0),y:player.y+16,vx:player.face*590,life:1.3});player.shotCD=.23;sparkle(player.x+(player.face>0?player.w:0),player.y+16,'#8cffe5',3)}const challenges=[
[
{title:'Bosque · Desafío 1: la llave',q:'¿Cuándo debe abrirse la puerta?',choices:['Siempre, aunque falte la llave','SI tengo llave, ENTONCES abrir','Nunca'],correct:1,explain:'La puerta se abre solo si la condición «tengo llave» se cumple.'},
{title:'Bosque · Desafío 2: cristales',q:'¿Qué ocurre si tienes solo 2 de 3 cristales?',choices:['El puente permanece cerrado','El puente se abre','Se eliminan los cristales'],correct:0,explain:'SI hay 3 o más cristales, se activa el puente; SI NO, continúa cerrado.'},
{title:'Bosque · Desafío 3: escudo',q:'¿Cuándo puedes dañar al guardián?',choices:['Mientras tenga escudo','SI el escudo está apagado','En cualquier momento'],correct:1,explain:'Una condición controla si los disparos pueden causar daño.'}
],
[
{title:'Ciudad · Desafío 1: tarjeta',q:'¿Qué necesita comprobar el acceso de la ciudad?',choices:['Si tienes la tarjeta','Si hace frío','El color del robot'],correct:0,explain:'SI la tarjeta está disponible, la barrera permite pasar.'},
{title:'Ciudad · Desafío 2: energía',q:'La ciudad requiere 3 baterías. ¿Qué condición sirve?',choices:['baterias == 0','baterias >= 3','baterias < 2'],correct:1,explain:'El operador >= significa mayor o igual a: 3 o más baterías.'},
{title:'Ciudad · Desafío 3: defensa',q:'SI apagas el escudo del centinela, ¿qué debe ocurrir?',choices:['Puede recibir daño','Se vuelve invencible','El jugador pierde'],correct:0,explain:'La acción depende de que el escudo esté desactivado.'}
],
[
{title:'Volcán · Desafío 1: portal térmico',q:'SI no tienes la llave térmica, ¿qué ocurre?',choices:['El portal se abre','El portal permanece cerrado','El jefe desaparece'],correct:1,explain:'La ruta SI NO se ejecuta cuando no se cumple la condición.'},
{title:'Volcán · Desafío 2: reactor',q:'¿Cuándo se enciende el reactor de 3 núcleos?',choices:['Con 1 núcleo','Con 2 núcleos','Con 3 o más núcleos'],correct:2,explain:'La condición se cumple al reunir al menos 3 núcleos.'},
{title:'Volcán · Desafío 3: jefe',q:'El escudo está activo. ¿Qué hará un disparo?',choices:['Causará daño igualmente','No hará daño hasta desactivar el escudo','Terminará el juego'],correct:1,explain:'SI el escudo está desactivado se permite daño; SI NO, se bloquea.'}
]
];
const ejemplosCodigo=[[{"condicion": "tengoLlave", "si": "abrirPuerta()", "sino": "mantenerPuertaCerrada()", "nota": "tengoLlave significa que recogiste la llave."}, {"condicion": "cristales >= 3", "si": "activarPuente()", "sino": "mantenerPuenteApagado()", "nota": ">= significa «mayor o igual que». El puente necesita 3 cristales."}, {"condicion": "!escudoActivo", "si": "hacerDanioAlGuardian()", "sino": "bloquearDisparo()", "nota": "! significa «NO»: el guardián recibe daño si NO tiene escudo."}], [{"condicion": "tengoTarjeta", "si": "abrirBarrera()", "sino": "mantenerBarreraCerrada()", "nota": "tengoTarjeta comprueba si recogiste la tarjeta de acceso."}, {"condicion": "baterias >= 3", "si": "encenderCiudad()", "sino": "mostrarBateriasFaltantes()", "nota": "La ciudad solo se enciende con 3 baterías o más."}, {"condicion": "!escudoCentinela", "si": "hacerDanioAlCentinela()", "sino": "bloquearDisparo()", "nota": "El centinela recibe daño cuando su escudo NO está activo."}], [{"condicion": "tengoLlaveTermica", "si": "abrirPortal()", "sino": "mantenerPortalCerrado()", "nota": "Si no tienes la llave térmica, se ejecuta la parte else."}, {"condicion": "nucleos >= 3", "si": "activarReactor()", "sino": "mantenerReactorApagado()", "nota": "El reactor requiere al menos tres núcleos de energía."}, {"condicion": "!escudoJefe", "si": "hacerDanioAlJefe()", "sino": "bloquearDisparo()", "nota": "Cuando el escudo deja de estar activo, el disparo puede hacer daño."}]];
function ejemploVisual(e){
 const code='if ('+e.condicion+') {\n  '+e.si+';\n} else {\n  '+e.sino+';\n}';
 return '<div class="code" style="white-space:pre-wrap;text-align:left;line-height:1.55"><strong>Así se escribe en JavaScript:</strong>\n'+code+'</div>'+
 '<p class="sub"><strong>Cómo leerlo:</strong> <b>if</b> significa «SI»; entre paréntesis está lo que comprobamos. La primera acción ocurre cuando es verdadero. <b>else</b> significa «SI NO» y ejecuta la otra acción.</p><p class="sub">'+e.nota+'</p>';

let completedChallenges=[false,false,false];
function challenge(part,advance){
 const c=challenges[worldIndex][part];mode='pause';overlay.classList.remove('hidden');
 let attempts=0;
 const display=(feedback='')=>{
 panel.innerHTML='<div class="mascot">🧠</div><h2>'+c.title+'</h2><p>'+c.q+'</p>'+
 c.choices.map((x,i)=>'<button class="secondary" data-choice="'+i+'">'+String.fromCharCode(65+i)+'. '+x+'</button>').join('')+
 '<p class="sub" id="challengeFeedback">'+(feedback||'Elige la decisión adecuada para avanzar.')+'</p>';
 panel.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{
  if(Number(el.dataset.choice)!==c.correct){attempts++;display('No es esa. Piensa: SI se cumple el requisito, ENTONCES ocurre la acción.');return}
  completedChallenges[part]=true;
  panel.innerHTML='<div class="mascot">⭐</div><h2>¡DESAFÍO SUPERADO!</h2><p>'+c.explain+'</p>'+
  ejemploVisual(ejemplosCodigo[worldIndex][part])+ 
  '<p class="sub">¡Bien! Aplica lo aprendido en el escenario.</p><button class="primary" id="advance">▶ CONTINUAR</button>';
  document.getElementById('advance').onclick=()=>{overlay.classList.add('hidden');mode='play';last=performance.now();advance()};
 });
 };
 display();
}

function quiz(){
 mode='quiz';overlay.classList.remove('hidden');
 const questions=[
  {q:'Tienes la llave. ¿Qué condición permite abrir la puerta?',options:['Abrir siempre','SI tengo la llave, abrir','Cerrar siempre'],correct:1,why:'Una condición comprueba si la llave está disponible antes de abrir.',code:'if (tengoLlave) {\n  abrirPuerta();\n} else {\n  mantenerPuertaCerrada();\n}',meaning:'SI tienes la llave, la puerta se abre. SI NO, permanece cerrada.'},
  {q:'La ciudad requiere tres baterías. ¿Cuándo se activa el puente?',options:['Cuando hay al menos tres baterías','Cuando no hay ninguna','Siempre'],correct:0,why:'La expresión baterias >= 3 significa tres o más baterías.',code:'if (baterias >= 3) {\n  activarPuente();\n} else {\n  mantenerPuenteApagado();\n}',meaning:'SI tienes tres o más baterías, se activa el puente. SI NO, permanece apagado. El símbolo >= significa «mayor o igual que».'},
  {q:'El jefe tiene escudo. ¿Qué debe comprobar el programa para permitir daño?',options:['Que el jefe sea grande','Que siempre reciba daño','Que el escudo esté desactivado'],correct:2,why:'SI el escudo está desactivado, ENTONCES el jefe puede recibir daño.',code:'if (escudoDesactivado) {\n  danarJefe();\n} else {\n  bloquearDisparo();\n}',meaning:'SI el escudo está desactivado, el disparo causa daño. SI NO, el disparo es bloqueado.'}
 ];
 const q=questions[worldIndex];
 panel.innerHTML='<div class="mascot">🏆</div><h2>Evaluación del mundo '+(worldIndex+1)+'</h2><p>'+q.q+'</p>'+q.options.map((o,i)=>'<button class="secondary" data-answer="'+i+'">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+'<p class="sub" id="feedback">Selecciona una respuesta.</p>';
 panel.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{
  if(Number(b.dataset.answer)!==q.correct){document.getElementById('feedback').textContent='Todavía no. Recuerda la regla SI / ENTONCES. Intenta otra vez.';return}
  const isLast=worldIndex===2;
  panel.innerHTML='<div class="mascot">🎉</div><h1>'+(isLast?'¡JUEGO COMPLETADO!':'¡MUNDO SUPERADO!')+'</h1><p><strong>Correcto.</strong> '+q.why+'</p><div class="code">'+q.code.replace(/\n/g,'<br>').replace(/  /g,'&nbsp;&nbsp;')+'</div><p class="sub"><strong>¿Qué significa?</strong> '+q.meaning+'</p><p class="sub">'+(isLast?'¡Aprendiste a interpretar condiciones desde cero!':'Prepárate para otro mundo con nuevos enemigos y desafíos.')+'</p><button class="primary" id="nextworld">'+(isLast?'↻ VOLVER A JUGAR':'➡️ ENTRAR AL MUNDO '+(worldIndex+2))+'</button>';
  document.getElementById('nextworld').onclick=()=>{if(isLast){worldIndex=0;reset(true)}else{worldIndex++;reset(false)}};
 })
}

 enemies.forEach((e,i)=>{e.alive=true;e.hp=worldIndex===2?3:2;e.base=worlds[worldIndex].enemies[i];e.x=e.base});
 bullets.length=0;particles.length=0;boss.alive=true;boss.hp=5+worldIndex;boss.shield=true;boss.x=2190;bossFire=1.5;bossShots.length=0;stage=1;camera=0;checkpoint=45;phase=0;asked1=asked2=askedBoss=answerCorrect=false;completedChallenges=[false,false,false];keys.left=keys.right=keys.jump=keys.shoot=false;
